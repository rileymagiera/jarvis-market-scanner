name: Jarvis Code Validation

on:
  push:
    branches: [main]
    paths:
      - "**/*.py"
      - "requirements.txt"
      - "static/**"
      - "templates/**"
      - "tests/**"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
    paths:
      - "**/*.py"
      - "requirements.txt"
      - "static/**"
      - "templates/**"
      - "tests/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.3"
          enable-cache: true
          cache-dependency-glob: requirements.txt
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install scanner test dependencies
        run: uv pip install --system -r requirements.txt pytest
      - name: Verify installed dependency consistency
        run: python -m pip check
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Run full Jarvis regression suite
        run: python -m pytest -q tests
      - name: Validate dashboard JavaScript asset
        run: node --check static/history_dashboard.js
      - name: Extract and validate Intelligence page scripts
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          import main
          html = main.research_page().body.decode("utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", html, flags=re.S)
          if not scripts:
              raise SystemExit("No Intelligence page scripts were found")
          for index, script in enumerate(scripts):
              Path(f"/tmp/jarvis-intelligence-{index}.js").write_text(script, encoding="utf-8")
          PY
          for script in /tmp/jarvis-intelligence-*.js; do node --check "$script"; done
