name: Webull OpenAPI One-Time Authorization Probe

on:
  push:
    branches: [probe/webull-openapi-once-20261120]
    paths: [.github/workflows/webull-openapi-one-shot.yml]

permissions:
  contents: read

jobs:
  verify-webull-market-data:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install read-only Webull SDK
        run: python -m pip install --disable-pip-version-check webull-openapi-python-sdk==3.1.0
      - name: Attempt one bounded read-only OpenAPI quote
        env:
          WEBULL_APP_KEY: ${{ secrets.WEBULL_APP_KEY }}
          WEBULL_APP_SECRET: ${{ secrets.WEBULL_APP_SECRET }}
        run: |
          python - <<'PY'
          import os
          import re
          import subprocess
          import sys

          if not os.getenv("WEBULL_APP_KEY") or not os.getenv("WEBULL_APP_SECRET"):
              sys.exit("Webull GitHub Actions credentials missing.")

          # Subprocess log is captured, not echoed: the SDK can log token values
          # and request internals that do not belong in public Actions logs.
          child = r"""
          import logging
          import os
          import re
          logging.disable(logging.CRITICAL)
          from webull.core.client import ApiClient
          from webull.data.data_client import DataClient
          try:
              api = ApiClient(os.environ["WEBULL_APP_KEY"], os.environ["WEBULL_APP_SECRET"], "us")
              api.add_endpoint("us", "api.webull.com")
              result = DataClient(api).market_data.get_history_bar("AAPL", "US_STOCK", "M15")
              print("JARVIS_WEBULL_HTTP_STATUS=" + str(getattr(result, "status_code", "unknown")))
          except Exception as exc:
              # Never print the raw exception: the Webull SDK can include
              # request metadata and token material in error details.
              message = str(exc)
              status = re.search(r"HTTP Status:\s*(\d{3})", message)
              code = re.search(r"\bCode:\s*([A-Z][A-Z0-9_]{1,64})", message)
              safe_codes = {
                  "VERIFY_FAILURE_EXCEED_LIMIT", "UNAUTHORIZED", "FORBIDDEN",
                  "INVALID_SIGNATURE", "INVALID_APP_KEY", "INVALID_TOKEN",
                  "TOKEN_EXPIRED", "VERIFY_FAILURE", "INSUFFICIENT_PERMISSION",
                  "PERMISSION_DENIED", "NOT_ENTITLED", "NOT_AUTHORIZED",
                  "INVALID_CREDENTIALS",
              }
              print("JARVIS_WEBULL_EXCEPTION=" + type(exc).__name__)
              print("JARVIS_WEBULL_ERROR_HTTP=" + (status.group(1) if status else "unknown"))
              print("JARVIS_WEBULL_ERROR_CODE=" + (
                  code.group(1) if code and code.group(1) in safe_codes else "unclassified"
              ))
              raise SystemExit(1)
          """
          try:
              run = subprocess.run([sys.executable, "-c", child], capture_output=True, text=True, timeout=80, check=False)
              raw = (run.stdout or "") + "\n" + (run.stderr or "")
          except subprocess.TimeoutExpired as exc:
              captured = exc.stdout or b""
              if isinstance(captured, bytes):
                  captured = captured.decode("utf-8", errors="replace")
              captured_err = exc.stderr or b""
              if isinstance(captured_err, bytes):
                  captured_err = captured_err.decode("utf-8", errors="replace")
              raw = captured + "\n" + captured_err
              print("Webull authorization result: timeout after 80 seconds (no repeated attempts).")
              if "VERIFY_FAILURE_EXCEED_LIMIT" in raw:
                  print("Webull verification failure limit is still active; contact Webull OpenAPI support.")
              elif "status:PENDING" in raw:
                  print("Webull app verification remained pending during the one-time test.")
              raise SystemExit(1)
          if "JARVIS_WEBULL_HTTP_STATUS=200" in raw:
              print("Webull authorization result: market-data API HTTP 200 on a read-only AAPL bar request.")
              raise SystemExit(0)
          # Report only allowlisted diagnostic fields, never raw SDK logs.
          code_match = re.search(r"JARVIS_WEBULL_ERROR_CODE=([A-Z_]+|unclassified)", raw)
          status_match = re.search(r"JARVIS_WEBULL_ERROR_HTTP=(\d{3}|unknown)", raw)
          code = code_match.group(1) if code_match else "unclassified"
          status = status_match.group(1) if status_match else "unknown"
          print("Webull OpenAPI diagnostic: HTTP=" + status + ", code=" + code)
          if code == "VERIFY_FAILURE_EXCEED_LIMIT":
              print("Webull verification limit remains active; further retries are paused.")
          elif code in ("UNAUTHORIZED", "INVALID_SIGNATURE", "INVALID_APP_KEY", "INVALID_CREDENTIALS"):
              print("Webull API credentials or requested authentication environment were rejected.")
          elif status == "403" or code in ("PERMISSION_DENIED", "NOT_ENTITLED", "INSUFFICIENT_PERMISSION"):
              print("Webull market data may not be entitled or application permission may be missing.")
          elif "status:EXPIRED" in raw:
              print("Webull app verification token expired.")
          elif "status:PENDING" in raw:
              print("Webull app verification remained pending during the attempt.")
          else:
              print("Webull did not return a usable read-only market-data quote.")
          raise SystemExit(1)
          PY
