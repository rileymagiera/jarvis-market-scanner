name: One-time publication credential review
on:
  push:
    branches:
      - audit/publication-credential-review-20261120
    paths:
      - .github/workflows/publication-credential-review.yml

permissions:
  actions: read
  contents: read

jobs:
  audit:
    if: github.event.head_commit.message == 'Run private publication credential review'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Audit Git objects and Actions archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import collections
          import concurrent.futures
          import io
          import json
          import os
          import re
          import subprocess
          import time
          import urllib.error
          import urllib.request
          import zipfile
          
          token = os.environ["GH_TOKEN"]
          api = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}"
          pattern = re.compile(rb"(?P<github>\b(?:gh[pousr]_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{40,})\b)|(?P<private_key>-----BEGIN (?:RSA |EC |DSA |OPENSSH |ENCRYPTED )?PRIVATE KEY-----)|(?P<aws>\b(?:AKIA|ASIA)[A-Z0-9]{16}\b)|(?P<google>\bAIza[A-Za-z0-9_-]{35}\b)|(?P<openai>\bsk-(?:proj-|svcacct-)?[A-Za-z0-9_-]{40,}\b)|(?P<slack>\bxox[baprs]-[A-Za-z0-9-]{12,}\b)|(?P<jwt>\beyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{12,}\.[A-Za-z0-9_-]{15,}\b)|(?P<credential_url>\b(?:https?|postgres(?:ql)?|redis|mongodb(?:\+srv)?):\/\/[^/\s\"'@]{2,}:[^/\s\"'@]{4,}@)|(?P<assignment>\b(?i:ALPACA_API_(?:KEY|SECRET)|APCA_API_(?:KEY_ID|SECRET_KEY)|WEBULL_APP_(?:KEY|SECRET)|JARVIS_(?:GMAIL_APP_PASSWORD|HISTORY_SYNC_TOKEN|SITE_PASSWORD)|COINBASE_API_(?:KEY|SECRET)|GITHUB_TOKEN|GH_TOKEN|SMTP_PASSWORD|CLIENT_SECRET|API_KEY|API_SECRET)[\"']?[ \t]*[:=][ \t]*[\"']?(?P<value>[A-Za-z0-9_+/@.-]{12,})[\"']?)")
          counts = collections.Counter()
          findings = collections.Counter()
          details = []
          failures = []
          
          def scan(data, kind, ident):
              local = collections.Counter()
              fast = data.lower()
              markers = (b"ghp_", b"gho_", b"ghu_", b"ghs_", b"ghr_", b"github_pat_", b"private key-----", b"akia", b"asia", b"aiza", b"sk-", b"xox", b"eyj", b"://", b"api_key", b"api_secret", b"app_key", b"app_secret", b"app_password", b"sync_token", b"site_password", b"github_token", b"gh_token", b"smtp_password", b"client_secret", b"apca_api_")
              if not any(marker in fast for marker in markers):
                  return kind, ident, local
              for hit in pattern.finditer(data):
                  category = hit.lastgroup
                  if hit.group("assignment"):
                      value = hit.group("value").lower()
                      if value.startswith((b"your-", b"your_", b"example", b"placeholder", b"replace", b"dummy", b"test", b"changeme", b"required_", b"missing_")) or len(set(value)) < 5:
                          continue
                      category = "assignment"
                  local[category] += 1
              return kind, ident, local
          
          def collect(result):
              kind, ident, local = result
              counts[kind] += 1
              for category, number in local.items():
                  findings[f"{kind}:{category}"] += number
                  if len(details) < 50:
                      details.append([kind, ident, category, number])
          
          subprocess.run(["git", "fetch", "--quiet", "--no-auto-gc", "origin", "+refs/pull/*:refs/remotes/audit-pulls/*"], check=True)
          refs = subprocess.check_output(["git", "for-each-ref", "--format=%(refname)", "refs/remotes/origin", "refs/remotes/audit-pulls", "refs/tags"]).splitlines()
          counts["heads"] = sum(ref.startswith(b"refs/remotes/origin/") and not ref.endswith(b"/HEAD") for ref in refs)
          counts["pull_request_refs"] = sum(ref.startswith(b"refs/remotes/audit-pulls/") for ref in refs)
          counts["tags"] = sum(ref.startswith(b"refs/tags/") for ref in refs)
          objects = subprocess.check_output(["git", "rev-list", "--objects", "--all"], text=True)
          object_ids = "".join(line.split(" ", 1)[0] + "\n" for line in objects.splitlines()).encode()
          object_types = subprocess.check_output(["git", "cat-file", "--batch-check"], input=object_ids).splitlines()
          with subprocess.Popen(["git", "cat-file", "--batch"], stdin=subprocess.PIPE, stdout=subprocess.PIPE) as reader:
              for line in object_types:
                  ident, kind, size = line.split()
                  if kind not in (b"blob", b"commit", b"tag"):
                      continue
                  reader.stdin.write(ident + b"\n")
                  reader.stdin.flush()
                  meta = reader.stdout.readline().split()
                  if len(meta) != 3 or meta[2] != size:
                      raise RuntimeError("Incomplete Git object read")
                  data = reader.stdout.read(int(size))
                  if len(data) != int(size) or reader.stdout.read(1) != b"\n":
                      raise RuntimeError("Truncated Git object")
                  collect(scan(data, "git_" + kind.decode(), ident.decode()))
              reader.stdin.close()
              if reader.wait():
                  raise RuntimeError("Failed to read Git object stream")
          
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          
          authenticated = urllib.request.build_opener(NoRedirect())
          
          def download(url):
              for attempt in range(4):
                  try:
                      req = urllib.request.Request(url, headers={"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28"})
                      with authenticated.open(req, timeout=45) as response:
                          return response.read(), response.headers.get("Link", "")
                  except urllib.error.HTTPError as exc:
                      if exc.code in (302, 303, 307, 308):
                          location = exc.headers["Location"]
                          if not location.startswith("https://"):
                              raise RuntimeError("Insecure archive redirect")
                          with urllib.request.urlopen(location, timeout=60) as response:
                              return response.read(), ""
                      if exc.code in (403, 429, 500, 502, 503, 504) and attempt < 3:
                          time.sleep(3 * 2 ** attempt)
                          continue
                      raise
                  except (TimeoutError, urllib.error.URLError):
                      if attempt == 3:
                          raise
                      time.sleep(3 * 2 ** attempt)
          
          def pages(path, key):
              url = api + path
              while url is not None:
                  data, link = download(url)
                  yield from json.loads(data)[key]
                  next_url = re.search(r'<([^>]+)>;\s*rel="next"', link)
                  url = next_url.group(1) if next_url else None
                  repository_api = "https://api.github.com/repositories/" + os.environ["GITHUB_REPOSITORY_ID"]
                  if url and not (url.startswith(api + "/actions/") or url.startswith(repository_api + "/actions/")):
                      raise RuntimeError("Signaled API pagination outside repository")
          
          def inspect_archive(item):
              kind, ident, path = item
              try:
                  data, _ = download(api + path)
                  local = collections.Counter()
                  entries = 0
                  def inspect_zip(content, depth):
                      nonlocal entries
                      with zipfile.ZipFile(io.BytesIO(content)) as archive:
                          for info in archive.infolist():
                              if info.is_dir():
                                  continue
                              value = archive.read(info)
                              if value.startswith(b"PK\x03\x04"):
                                  if depth >= 2:
                                      raise RuntimeError("Archive nesting exceeds audit depth")
                                  inspect_zip(value, depth + 1)
                              else:
                                  local.update(scan(value, kind, ident)[2])
                                  entries += 1
                  inspect_zip(data, 0)
                  return kind, ident, local, entries, None
              except urllib.error.HTTPError as exc:
                  return kind, ident, None, 0, exc.code
              except (TimeoutError, urllib.error.URLError, RuntimeError, zipfile.BadZipFile):
                  return kind, ident, None, 0, "read_failed"
          
          runs = list(pages("/actions/runs?per_page=100", "workflow_runs"))
          counts["runs_listed"] = len(runs)
          workflows = {"jarvis-alerts.yml", "jarvis-historical-research-archive.yml", "coinbase-secondary-validation-tests.yml"}
          selected = [run for run in runs if run["path"].split("@")[0].rsplit("/", 1)[-1] in workflows and run["status"] == "completed"]
          items = [("run_logs", run["id"], f"/actions/runs/{run['id']}/attempts/{attempt}/logs") for run in selected for attempt in range(1, run.get("run_attempt", 1) + 1)]
          counts["log_archives_selected"] = len(items)
          for artifact in pages("/actions/artifacts?per_page=100", "artifacts"):
              if artifact["expired"]:
                  counts["expired_artifacts"] += 1
              else:
                  ident = artifact["id"]
                  items.append(("artifact", ident, f"/actions/artifacts/{ident}/zip"))
                  counts["artifacts_selected"] += 1
          
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as pool:
              for kind, ident, local, entries, error in pool.map(inspect_archive, items):
                  if error is not None:
                      failures.append([kind, ident, error])
                  else:
                      counts[kind + "_files"] += entries
                      collect((kind, ident, local))
          
          print("CREDENTIAL AUDIT " + json.dumps({"counts": counts, "findings": findings, "details": details, "unreadable": failures}, sort_keys=True))
          if findings or any(error not in (404, 410) for _, _, error in failures):
              raise SystemExit(1)
          PY
