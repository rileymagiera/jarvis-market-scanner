name: Validate Jarvis Early Runner
on:
  push:
    branches: [main]
    paths:
      - "main.py"
      - "send_alerts.py"
      - "early_runner.py"
      - "tests/**"
      - ".github/workflows/validate-early-runner.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check -r requirements.txt pytest
      - name: Compile scanner modules
        run: python -m py_compile main.py send_alerts.py early_runner.py
      - name: Run early runner tests
        run: python -m pytest -q tests
