name: Jarvis Market Alerts

on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:
    inputs:
      send_test_email:
        description: "Send a test email instead of scanning markets"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: jarvis-market-alerts
  cancel-in-progress: false

jobs:
  scan-and-alert:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out scanner
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Jarvis
        env:
          JARVIS_GMAIL_USER: ${{ secrets.JARVIS_GMAIL_USER }}
          JARVIS_GMAIL_APP_PASSWORD: ${{ secrets.JARVIS_GMAIL_APP_PASSWORD }}
          JARVIS_ALERT_TO: ${{ secrets.JARVIS_ALERT_TO }}
          JARVIS_HISTORY_SYNC_TOKEN: ${{ secrets.JARVIS_HISTORY_SYNC_TOKEN }}
          JARVIS_SITE_USERNAME: ${{ secrets.JARVIS_SITE_USERNAME }}
          JARVIS_SITE_PASSWORD: ${{ secrets.JARVIS_SITE_PASSWORD }}
          JARVIS_SCANNER_URL: https://jarvis-market-scanner.onrender.com
          SEND_TEST_EMAIL: ${{ inputs.send_test_email }}
        run: |
          test -n "$JARVIS_GMAIL_USER" || (echo "Missing JARVIS_GMAIL_USER" && exit 1)
          test -n "$JARVIS_GMAIL_APP_PASSWORD" || (echo "Missing JARVIS_GMAIL_APP_PASSWORD" && exit 1)
          test -n "$JARVIS_ALERT_TO" || (echo "Missing JARVIS_ALERT_TO" && exit 1)
          test -n "$JARVIS_SITE_USERNAME" || (echo "Missing JARVIS_SITE_USERNAME" && exit 1)
          test -n "$JARVIS_SITE_PASSWORD" || (echo "Missing JARVIS_SITE_PASSWORD" && exit 1)
          if [ "$SEND_TEST_EMAIL" = "true" ]; then
            python send_alerts.py --test
          else
            python send_alerts.py
          fi
      - name: Save alert deduplication state
        if: ${{ success() && inputs.send_test_email != true }}
        run: |
          if [ -n "$(git status --porcelain alert_state.json paper_tracker.json paper_tracker_lifetime.json buy_signal_history.json scan_diagnostics.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add alert_state.json paper_tracker.json paper_tracker_lifetime.json buy_signal_history.json scan_diagnostics.json
            git commit -m "Update Jarvis alert state"
            git push
          fi
