name: Jarvis Market Alerts

on:
  # cron-job.org is the sole scheduler and triggers this workflow via workflow_dispatch.
  workflow_dispatch:
    inputs:
      send_test_email:
        description: "Send a test email instead of scanning markets"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: jarvis-market-alerts
  cancel-in-progress: false

jobs:
  scan-and-alert:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out scanner
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.3"
          enable-cache: true
          cache-dependency-glob: requirements.txt
      - name: Install scanner dependencies
        run: |
          # Fast path; retain pip fallback so uv resolution/network issues do not disable scans.
          uv pip install --system -r requirements.txt || python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Restore Kraken hourly candle cache
        if: ${{ inputs.send_test_email != true }}
        uses: actions/cache@v5
        with:
          path: .cache/kraken_ohlc.json
          key: jarvis-kraken-ohlc-v1-${{ github.run_id }}
          restore-keys: |
            jarvis-kraken-ohlc-v1-
      - name: Record scan attempt start
        if: ${{ inputs.send_test_email != true }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          path = "scan_metadata.json"
          try:
              with open(path, encoding="utf-8") as f:
                  metadata = json.load(f)
          except (OSError, json.JSONDecodeError):
              metadata = {}
          metadata.update({
              "last_scan_started_at": datetime.now(timezone.utc).isoformat(),
              "last_attempt_status": "running",
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "run_number": os.environ.get("GITHUB_RUN_NUMBER"),
              "commit_sha": os.environ.get("GITHUB_SHA"),
          })
          with open(path, "w", encoding="utf-8") as f:
              json.dump(metadata, f, indent=2)
              f.write("\n")
          PY
      - name: Start Render dashboard warmup while scanner runs
        if: ${{ inputs.send_test_email != true }}
        run: |
          # Non-blocking public health check. This can wake a sleeping dashboard
          # before the scanner sends its full lossless history sync.
          # It never changes provider coverage, state files, history, or paper trades.
          (
            curl --fail --silent --show-error --connect-timeout 5 --max-time 55 \
              --output /dev/null \
              --write-out 'HTTP %{http_code} in %{time_total}s\n' \
              https://jarvis-market-scanner.onrender.com/health \
              > "$RUNNER_TEMP/jarvis-render-warmup.txt" 2>&1 || true
          ) </dev/null >/dev/null 2>&1 &
      - name: Run Jarvis
        id: jarvis
        env:
          JARVIS_GMAIL_USER: ${{ secrets.JARVIS_GMAIL_USER }}
          JARVIS_GMAIL_APP_PASSWORD: ${{ secrets.JARVIS_GMAIL_APP_PASSWORD }}
          JARVIS_ALERT_TO: ${{ secrets.JARVIS_ALERT_TO }}
          JARVIS_HISTORY_SYNC_TOKEN: ${{ secrets.JARVIS_HISTORY_SYNC_TOKEN }}
          JARVIS_SCANNER_URL: https://jarvis-market-scanner.onrender.com
          # Set repository variable to 'false' to restore fully serialized Kraken REST requests.
          JARVIS_KRAKEN_PAIR_SCOPED_PACING: ${{ vars.JARVIS_KRAKEN_PAIR_SCOPED_PACING || 'true' }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          ALPACA_STOCK_DATA_FEED: ${{ vars.ALPACA_STOCK_DATA_FEED || 'iex' }}
          WEBULL_APP_KEY: ${{ secrets.WEBULL_APP_KEY }}
          WEBULL_APP_SECRET: ${{ secrets.WEBULL_APP_SECRET }}
          WEBULL_SHADOW_MODE: 'true'
          WEBULL_SHADOW_MAX_SYMBOLS_PER_SCAN: '30'
          CRYPTO_SHADOW_MAX_SYMBOLS_PER_SCAN: '50'
          # Restore original per-symbol Binance.US shadow requests with repository variable 'false'.
          JARVIS_BINANCE_US_SHADOW_BATCH_ENABLED: ${{ vars.JARVIS_BINANCE_US_SHADOW_BATCH_ENABLED || 'true' }}
          # Experimental entries remain paper-only in the existing shared paper account.
          JARVIS_ENABLE_EARLY_ENTRY_EXPERIMENTAL: 'true'
          SEND_TEST_EMAIL: ${{ inputs.send_test_email }}
        run: |
          test -n "$JARVIS_GMAIL_USER" || (echo "Missing JARVIS_GMAIL_USER" && exit 1)
          test -n "$JARVIS_GMAIL_APP_PASSWORD" || (echo "Missing JARVIS_GMAIL_APP_PASSWORD" && exit 1)
          test -n "$JARVIS_ALERT_TO" || (echo "Missing JARVIS_ALERT_TO" && exit 1)
          if [ -n "$ALPACA_API_KEY" ] && [ -n "$ALPACA_API_SECRET" ]; then
            echo "Alpaca credentials are configured for the local scanner."
          else
            echo "Alpaca credentials are missing; scan will report Alpaca as not configured."
          fi
          if [ -n "$WEBULL_APP_KEY" ] && [ -n "$WEBULL_APP_SECRET" ]; then
            echo "Webull credentials are configured; read-only shadow sampling is enabled."
          else
            echo "Webull credentials are missing; shadow sampling will remain idle until GitHub Actions secrets are added."
          fi
          python -m py_compile main.py send_alerts.py early_runner.py paper_trading.py
          # Full regression tests run in CI on code PRs and pushes, not on every market scan.
          if [ "$SEND_TEST_EMAIL" = "true" ]; then
            python send_alerts.py --test
          else
            python send_alerts.py
          fi
      - name: Report Render dashboard warmup
        if: ${{ always() && inputs.send_test_email != true }}
        run: |
          if [ -s "$RUNNER_TEMP/jarvis-render-warmup.txt" ]; then
            cat "$RUNNER_TEMP/jarvis-render-warmup.txt"
          else
            echo "Warmup still running or unavailable; scanner and history sync unchanged."
          fi
      - name: Persist and summarize scan audit
        if: ${{ steps.jarvis.outcome == 'success' && inputs.send_test_email != true }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          paths = {
              "diagnostics": "scan_diagnostics.json",
              "paper_tracker": "paper_tracker.json",
              "lifetime": "paper_tracker_lifetime.json",
              "buy_signals": "buy_signal_history.json",
              "paper_trading": "paper_trading_state.json",
              "metadata": "scan_metadata.json",
          }
          parsed = {}
          errors = []
          for key, path in paths.items():
              try:
                  parsed[key] = json.loads(Path(path).read_text(encoding="utf-8"))
              except Exception as exc:
                  errors.append(f"{path}: {type(exc).__name__}: {exc}")
          d = parsed.get("diagnostics", {})
          stocks = (d.get("diagnostics") or {}).get("stocks", {})
          crypto = (d.get("diagnostics") or {}).get("crypto", {})
          stock_stages = stocks.get("stages") or {}
          crypto_stages = crypto.get("stages") or {}
          stock_records = [r for r in (parsed.get("paper_tracker") or {}).values()
                           if isinstance(r, dict) and r.get("asset_type") == "stock" and r.get("currently_surfaced") is True]
          stock_last_known = sum(
              1 for r in stock_records
              if str(r.get("price_validation_status") or "").lower() == "last_known"
          )
          stock_verified = sum(
              1 for r in stock_records
              if str(r.get("price_validation_status") or "").lower() == "verified"
              or (
                  not r.get("price_validation_status")
                  and r.get("price_validation_passed") is True
              )
          )
          stock_unverified = max(0, len(stock_records) - stock_verified - stock_last_known)
          stock_stage_unverified = stock_stages.get("PRICE UNVERIFIED — WATCH ONLY", 0)
          crypto_unverified = crypto.get("price_validation", {}).get("unverified", 0)
          timing = (d.get("diagnostics") or {}).get("timing_breakdown") or {}
          provider_activity = timing.get("provider_activity") or {}
          http_status_counts = provider_activity.get("provider_http_status_counts") or {}
          http_429_count = int(provider_activity.get("provider_http_429_count") or 0)
          http_5xx_count = int(provider_activity.get("provider_http_5xx_count") or 0)
          audit = {
              "audit_timestamp": d.get("timestamp"),
              "audit_run_id": os.environ.get("GITHUB_RUN_ID"),
              "audit_status": "passed" if not errors and d.get("timestamp") else "failed",
              "files_valid_json": list(parsed.keys()),
              "file_validation_errors": errors,
              "candidates_total": d.get("candidates_found", 0),
              "stocks_returned": stocks.get("candidates_returned", 0),
              "stocks_price_verified": stock_verified,
              "stocks_price_last_known": stock_last_known,
              "stocks_price_unverified": stock_unverified,
              "stocks_stage_unverified_watch_only": stock_stage_unverified,
              "crypto_returned": crypto.get("candidates_returned", 0),
              "crypto_price_verified": crypto.get("price_validation", {}).get("verified", 0),
              "crypto_price_unverified": crypto_unverified,
              "scan_errors": d.get("errors") or [],
              "provider_http_status_counts": http_status_counts,
              "provider_http_429_count": http_429_count,
              "provider_http_5xx_count": http_5xx_count,
              "stock_stage_counts": stock_stages,
              "crypto_stage_counts": crypto_stages,
              "history_sync_reported": True,
          }
          metadata = parsed.get("metadata", {})
          metadata["scan_audit"] = audit
          Path("scan_metadata.json").write_text(json.dumps(metadata, indent=2) + "\n", encoding="utf-8")
          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          lines = [
              "## Jarvis Scan Audit",
              f"- Audit status: **{audit['audit_status']}**",
              f"- Candidates: **{audit['candidates_total']}**",
              f"- Stocks: {audit['stocks_returned']} returned; {audit['stocks_price_verified']} live-verified; {audit['stocks_price_last_known']} last-known EOD references; {audit['stocks_price_unverified']} genuinely unverified (stage-only watch label count: {audit['stocks_stage_unverified_watch_only']})",
              f"- Crypto: {audit['crypto_returned']} returned; {audit['crypto_price_verified']} price-verified; {audit['crypto_price_unverified']} unverified",
              f"- Scanner errors: **{len(audit['scan_errors'])}**",
              f"- Provider HTTP rate limits (429): **{audit['provider_http_429_count']}**",
              f"- Provider HTTP server errors (5xx): **{audit['provider_http_5xx_count']}**",
              f"- Provider HTTP status counts: {json.dumps(audit['provider_http_status_counts'], sort_keys=True)}",
              f"- JSON persistence checks: {len(parsed)}/{len(paths)} files valid",
          ]
          if audit["scan_errors"]:
              lines.append("- Error detail: " + "; ".join(f"{e.get('symbol','?')}: {e.get('error','unknown')}" for e in audit["scan_errors"]))
          summary.write_text("\n".join(lines) + "\n", encoding="utf-8")
          if errors or not d.get("timestamp"):
              print("AUDIT FAILURE:", errors or "Diagnostics timestamp missing")
              raise SystemExit(1)
          print("Scan audit verified and recorded.")
          PY
      - name: Build compact historical opportunity audit export
        if: ${{ steps.jarvis.outcome == 'success' && inputs.send_test_email != true }}
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          from early_opportunity_radar import REPLAY_LEVEL_FIELDS
          from historical_audit_export import build_historical_audit_export

          tracker = json.loads(Path("paper_tracker.json").read_text(encoding="utf-8"))
          buy_state = json.loads(Path("buy_signal_history.json").read_text(encoding="utf-8"))
          metadata = json.loads(Path("scan_metadata.json").read_text(encoding="utf-8"))
          paper_account = json.loads(Path("paper_trading_state.json").read_text(encoding="utf-8"))
          records = [row for row in tracker.values() if isinstance(row, dict)] if isinstance(tracker, dict) else []
          signals = buy_state.get("signals", []) if isinstance(buy_state, dict) else []
          export = build_historical_audit_export(
              records,
              signals,
              last_scan_completed_at=metadata.get("last_scan_completed_at"),
              scan_run_id=metadata.get("run_id"),
              synced_at=metadata.get("last_scan_completed_at"),
              history_source="github_actions_scan_workspace",
              paper_account=paper_account,
              paper_position_watch=(metadata.get("scan_diagnostics") or {}).get("paper_position_watch"),
          )
          export["risk_off_comparison"] = (paper_account.get("risk_off_comparison") or {}).get("summary")
          scan_id = str(metadata.get("run_id") or "")
          snapshot_coverage = {}
          for asset in ("stock", "crypto"):
              snapshots = [
                  snap for row in records if row.get("asset_type") == asset
                  for snap in (row.get("signal_history") or [])
                  if isinstance(snap, dict) and scan_id and str(snap.get("scan_id")) == scan_id
              ]
              snapshot_coverage[asset] = {
                  "saved_snapshots": len(snapshots),
                  "outcome_eligible_snapshots": sum(s.get("outcome_eligible") is True for s in snapshots),
                  "snapshots_with_all_trade_levels": sum(
                      set(REPLAY_LEVEL_FIELDS).issubset(s.get("replay_levels") or {}) for s in snapshots
                  ),
                  "verified_but_outcome_ineligible_by_data_type": dict(Counter(
                      s.get("data_type") or "unknown" for s in snapshots
                      if s.get("price_verified") is True and s.get("outcome_eligible") is not True
                  )),
              }
          export["entry_timing_lab"]["current_scan_snapshot_coverage"] = snapshot_coverage
          Path("jarvis_historical_audit.json").write_text(
              json.dumps(export, separators=(",", ":")) + "\n", encoding="utf-8"
          )
          print(
              "Historical audit export built: "
              f"{export['provenance']['retained_candidate_records']} retained records, "
              f"{export['missed_runners']['total_verified_watchlist_runners']} verified missed runners, "
              f"{export['buy_gate_failures']['total_events']} BUY-gate events."
          )
          PY
      - name: Upload compact historical opportunity audit
        if: ${{ steps.jarvis.outcome == 'success' && inputs.send_test_email != true }}
        uses: actions/upload-artifact@v7
        with:
          name: jarvis-historical-opportunity-audit
          path: jarvis_historical_audit.json
          if-no-files-found: error
          retention-days: 1
      - name: Record rolling provider usage history
        if: ${{ steps.jarvis.outcome == 'success' && inputs.send_test_email != true }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          diagnostics = json.loads(Path("scan_diagnostics.json").read_text(encoding="utf-8"))
          details = diagnostics.get("diagnostics") or {}
          timing = details.get("timing_breakdown") or {}
          activity = timing.get("provider_activity") or {}
          now = datetime.now(timezone.utc)
          run_id = str(os.environ.get("GITHUB_RUN_ID") or "")
          timestamp = diagnostics.get("timestamp") or now.isoformat()
          providers = {}
          for name, item in (activity.get("providers") or {}).items():
              if not isinstance(item, dict):
                  continue
              providers[name] = {
                  "calls": int(item.get("calls") or 0),
                  "failures": int(item.get("failures") or 0),
                  "total_seconds": round(float(item.get("total_seconds") or 0), 3),
              }
          record = {
              "timestamp": timestamp,
              "run_id": run_id,
              "scan_duration_seconds": round(float(timing.get("total_seconds") or details.get("scan_duration_seconds") or 0), 2),
              "http_status_counts": activity.get("provider_http_status_counts") or {},
              "http_429": int(activity.get("provider_http_429_count") or 0),
              "http_5xx": int(activity.get("provider_http_5xx_count") or 0),
              "instrumentation_calls_by_operation": providers,
          }
          path = Path("provider_usage_history.json")
          try:
              history = json.loads(path.read_text(encoding="utf-8"))
          except (OSError, json.JSONDecodeError):
              history = {"schema_version": 1, "records": []}
          records = [r for r in history.get("records", []) if isinstance(r, dict)]
          if run_id and any(str(r.get("run_id")) == run_id for r in records):
              records = [r for r in records if str(r.get("run_id")) != run_id]
          cutoff = now - timedelta(days=90)
          retained = []
          for item in records + [record]:
              try:
                  item_time = datetime.fromisoformat(str(item.get("timestamp")).replace("Z", "+00:00"))
                  if item_time.tzinfo is None:
                      item_time = item_time.replace(tzinfo=timezone.utc)
              except (TypeError, ValueError):
                  continue
              if item_time >= cutoff:
                  retained.append(item)
          retained = retained[-1000:]

          def summarize(items):
              result = {
                  "scan_count": len(items),
                  "http_429": 0,
                  "http_5xx": 0,
                  "http_status_counts": {},
                  "instrumentation_calls_by_operation": {},
                  "scan_duration_seconds_total": 0.0,
              }
              for item in items:
                  result["http_429"] += int(item.get("http_429") or 0)
                  result["http_5xx"] += int(item.get("http_5xx") or 0)
                  result["scan_duration_seconds_total"] += float(item.get("scan_duration_seconds") or 0)
                  for key, value in (item.get("http_status_counts") or {}).items():
                      result["http_status_counts"][key] = result["http_status_counts"].get(key, 0) + int(value or 0)
                  for key, stats in (item.get("instrumentation_calls_by_operation") or {}).items():
                      target = result["instrumentation_calls_by_operation"].setdefault(key, {"calls": 0, "failures": 0, "total_seconds": 0.0})
                      target["calls"] += int(stats.get("calls") or 0)
                      target["failures"] += int(stats.get("failures") or 0)
                      target["total_seconds"] += float(stats.get("total_seconds") or 0)
              result["scan_duration_seconds_total"] = round(result["scan_duration_seconds_total"], 2)
              for stats in result["instrumentation_calls_by_operation"].values():
                  stats["total_seconds"] = round(stats["total_seconds"], 2)
              return result

          day_ago = now - timedelta(days=1)
          week_ago = now - timedelta(days=7)
          def in_window(item, start):
              try:
                  value = datetime.fromisoformat(str(item.get("timestamp")).replace("Z", "+00:00"))
                  if value.tzinfo is None:
                      value = value.replace(tzinfo=timezone.utc)
                  return value >= start
              except (TypeError, ValueError):
                  return False

          history = {
              "schema_version": 1,
              "updated_at": now.isoformat(),
              "retention_days": 90,
              "records": retained,
              "summary": {
                  "last_24_hours": summarize([r for r in retained if in_window(r, day_ago)]),
                  "last_7_days": summarize([r for r in retained if in_window(r, week_ago)]),
              },
              "measurement_note": "HTTP status counts reflect instrumented HTTP responses. Operation call counts are function-level telemetry where available; they are not guaranteed billing or quota request totals.",
          }
          path.write_text(json.dumps(history, indent=2) + "\n", encoding="utf-8")
          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          week = history["summary"]["last_7_days"]
          with summary.open("a", encoding="utf-8") as handle:
              handle.write(
                  "\\n## Rolling Provider Usage (7 days)\\n"
                  f"- Scans recorded: **{week['scan_count']}**\\n"
                  f"- Instrumented HTTP 429 / 5xx: **{week['http_429']} / {week['http_5xx']}**\\n"
                  f"- Instrumented HTTP status counts: `{json.dumps(week['http_status_counts'], sort_keys=True)}`\\n"
                  "- Function-level operation counts are telemetry, not guaranteed billing totals.\\n"
              )
          print(f"Recorded provider usage for run {run_id}; retained {len(retained)} scans.")
          PY
      - name: Finalize scan attempt status
        if: ${{ always() && inputs.send_test_email != true }}
        env:
          JARVIS_STEP_OUTCOME: ${{ steps.jarvis.outcome }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          path = "scan_metadata.json"
          try:
              with open(path, encoding="utf-8") as f:
                  metadata = json.load(f)
          except (OSError, json.JSONDecodeError):
              metadata = {}
          # A valid scanner response counts as a completed scan even if
          # the later email-delivery step fails.
          if os.environ.get("JARVIS_STEP_OUTCOME") != "success":
              metadata["last_attempt_status"] = "failed"
              metadata["last_attempt_failed_at"] = datetime.now(timezone.utc).isoformat()
              metadata["last_attempt_error"] = "Jarvis scan or history persistence step failed; inspect the Run Jarvis step logs."
          metadata.setdefault("run_id", os.environ.get("GITHUB_RUN_ID"))
          metadata.setdefault("run_number", os.environ.get("GITHUB_RUN_NUMBER"))
          metadata.setdefault("commit_sha", os.environ.get("GITHUB_SHA"))
          with open(path, "w", encoding="utf-8") as f:
              json.dump(metadata, f, indent=2)
              f.write("\n")
          PY
      - name: Save alert deduplication state
        if: ${{ always() && inputs.send_test_email != true }}
        run: |
          # Ensure the shadow-history state path exists even if the scan failed early.
          if [ ! -f crypto_shadow_comparison.json ]; then
            printf '{"schema_version":1,"summary":{"providers":{}},"recent_records":[],"records":[]}\\n' > crypto_shadow_comparison.json
          fi
          if [ ! -f webull_yahoo_comparison.json ]; then
            printf '{"schema_version":1,"summary":{},"recent_records":[],"records":[]}\\n' > webull_yahoo_comparison.json
          fi
          # Force-add the machine-owned state files before checking for changes.
          # This also prevents an ignored/untracked local state file from blocking
          # a later rebase with "would be overwritten" errors.
          git add -f alert_state.json paper_tracker.json paper_tracker_lifetime.json buy_signal_history.json paper_trading_state.json scan_diagnostics.json scan_metadata.json provider_usage_history.json webull_yahoo_comparison.json crypto_shadow_comparison.json
          if git diff --cached --quiet; then
            echo "No Jarvis state changes to persist."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update Jarvis alert state"

          # Serialize workflow runs with the job-level concurrency group, then
          # rebase this completed scan commit on top of any intervening code push.
          # If a machine-owned state file changed concurrently, keep this run's
          # freshly generated copy; never silently choose a version for code files.
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "Jarvis state pushed successfully (attempt $attempt)."
              exit 0
            fi

            echo "Push attempt $attempt rejected; fetching and rebasing on origin/main."
            git fetch origin main
            if git rebase origin/main; then
              continue
            fi

            conflicts="$(git diff --name-only --diff-filter=U)"
            if [ -z "$conflicts" ]; then
              echo "Rebase failed without resolvable state-file conflicts."
              git rebase --abort || true
              exit 1
            fi

            while IFS= read -r path; do
              case "$path" in
                alert_state.json|paper_tracker.json|paper_tracker_lifetime.json|buy_signal_history.json|paper_trading_state.json|scan_diagnostics.json|scan_metadata.json|provider_usage_history.json|webull_yahoo_comparison.json|crypto_shadow_comparison.json)
                  echo "Resolving generated state conflict with this run's completed scan: $path"
                  git checkout --theirs -- "$path"
                  git add -f "$path"
                  ;;
                *)
                  echo "Unexpected code conflict while saving state: $path"
                  git rebase --abort || true
                  exit 1
                  ;;
              esac
            done <<< "$conflicts"

            GIT_EDITOR=true git rebase --continue
          done

          echo "Unable to persist Jarvis state after 5 push attempts."
          exit 1
