name: Validate Overview dashboard JavaScript
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  dashboard-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Extract and syntax-check Overview script
        run: |
          python - <<'PY' > /tmp/overview.js
          import re
          source = open("main.py", encoding="utf-8").read()
          match = re.search(r"const status=document.getElementById\('updated'\);.*?</script>", source, re.S)
          if not match:
              raise SystemExit("Overview dashboard script block not found")
          print(match.group(0).removesuffix("</script>"))
          PY
          node --check /tmp/overview.js
